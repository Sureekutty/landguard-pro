<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="95" fill="#f8fafc" stroke="#1e3a8a" stroke-width="4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#ca8a04" stroke-width="2"/>
  
  <!-- Outer Ring Text (Emblem of Tamil Nadu) -->
  <path id="textCircle" d="M 25,100 A 75,75 0 1,1 175,100 A 75,75 0 1,1 25,100" fill="none"/>
  
  <!-- Gopuram (Temple Tower) silhouette -->
  <polygon points="100,32 104,40 96,40" fill="#ca8a04"/>
  <polygon points="100,40 108,55 92,55" fill="#b45309"/>
  <polygon points="100,55 114,75 86,75" fill="#ca8a04"/>
  <polygon points="100,75 120,98 80,98" fill="#b45309"/>
  <rect x="75" y="98" width="50" height="28" fill="#1e3a8a" rx="2"/>
  
  <!-- Gateway Arch -->
  <path d="M 90,126 A 10,10 0 0,1 110,126 L 110,126 L 90,126 Z" fill="#f8fafc"/>
  
  <!-- Indian National Tricolor accents -->
  <rect x="85" y="103" width="30" height="3" fill="#ea580c"/>
  <rect x="85" y="106" width="30" height="3" fill="#ffffff"/>
  <rect x="85" y="109" width="30" height="3" fill="#16a34a"/>
  
  <!-- Bottom Banner & Text -->
  <path d="M 40,150 Q 100,165 160,150 L 155,165 Q 100,180 45,165 Z" fill="#1e3a8a"/>
  <text x="100" y="162" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">TAMIL NADU GOVERNMENT</text>
  <text x="100" y="174" font-size="7.5" font-family="system-ui, sans-serif" fill="#ca8a04" text-anchor="middle">வாய்மையே வெல்லும்</text>
</svg>
