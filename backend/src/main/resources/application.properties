# LandGuard Pro - Production Spring Boot Configuration
server.port=${PORT:8080}
spring.application.name=landguard-backend

# Datasource Configuration (PostgreSQL in Production, H2 fallback for local/dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:landguard_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security & JWT Configuration
# Note: For production, set JWT_SECRET environment variable to a 64+ char cryptographically random key
app.jwt.secret=${JWT_SECRET:4c616e64477561726450726f5365637572654a57545365637265744b657932303236466f7254616d696c4e6164754c616e6444756544696c6967656e6365}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Initial Bootstrap Credentials (configurable via env)
app.security.admin.username=${ADMIN_BOOTSTRAP_USERNAME:admin}
app.security.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sureekutty.github.io,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000}

# File Upload Thresholds for Land Title PDFs
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Actuator & Health Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
